<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree Saya</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk ikon sosial media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Foto Profil -->
        <div class="profile-card">
            <img src="https://via.placeholder.com/120" alt="Foto Profil" class="profile-img">
            <h1>Nama Anda</h1>
            <p>Deskripsi singkat atau bio Anda di sini (Contoh: Web Developer | Content Creator)</p>
        </div>

        <!-- Daftar Link -->
        <div class="links-container">
            <a href="https://github.com/usernamekamu" target="_blank" class="link-item">
                <i class="fa-brands fa-github"></i> GitHub Profile
            </a>
            <a href="https://linkedin.com/in/usernamekamu" target="_blank" class="link-item">
                <i class="fa-brands fa-linkedin"></i> LinkedIn
            </a>
            <a href="https://instagram.com/usernamekamu" target="_blank" class="link-item">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="https://youtube.com/@channelkamu" target="_blank" class="link-item">
                <i class="fa-brands fa-youtube"></i> YouTube Channel
            </a>
            <a href="https://wa.me/6281234567890" target="_blank" class="link-item">
                <i class="fa-brands fa-whatsapp"></i> Hubungi via WhatsApp
            </a>
            <a href="https://portfolio-kamu.com" target="_blank" class="link-item">
                <i class="fa-solid fa-globe"></i> Website Portofolio
            </a>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with ❤️ by Nama Anda</p>
        </footer>
    </div>

</body>
</html>
